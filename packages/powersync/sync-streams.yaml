config:
  edition: 3

streams:
  memberships:
    auto_subscribe: true
    priority: 1
    query: |
      SELECT * FROM membership
      WHERE user_id = auth.user_id()

  household_ledger:
    accept_potentially_dangerous_queries: true
    queries:
      - |
        SELECT * FROM accounts
        WHERE household_id = subscription.parameter('household_id')
          AND household_id IN (
            SELECT household_id FROM membership
            WHERE user_id = auth.user_id()
          )
          AND (visibility = 'public' OR owner_user_id = auth.user_id())
      - |
        SELECT * FROM categories
        WHERE household_id = subscription.parameter('household_id')
          AND household_id IN (
            SELECT household_id FROM membership
            WHERE user_id = auth.user_id()
          )
      - |
        SELECT * FROM transactions
        WHERE household_id = subscription.parameter('household_id')
          AND household_id IN (
            SELECT household_id FROM membership
            WHERE user_id = auth.user_id()
          )
          AND account_id IN (
            SELECT id FROM accounts
            WHERE household_id = subscription.parameter('household_id')
              AND (visibility = 'public' OR owner_user_id = auth.user_id())
          )
          AND (
            to_account_id IS NULL OR to_account_id IN (
              SELECT id FROM accounts
              WHERE household_id = subscription.parameter('household_id')
                AND (visibility = 'public' OR owner_user_id = auth.user_id())
            )
          )
