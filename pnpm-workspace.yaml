packages:
  - "apps/*"
  - "packages/*"

# Keep explicit script names from auto-chaining: `pnpm build` must not
# trigger the Expo `prebuild` hook (turbo owns the build task graph).
enablePrePostScripts: false

overrides:
  "lightningcss": "1.30.1"

# TanStack's adapter still declares PowerSync Common 1.x, while its structural
# database APIs pass against the 2.2 runtime required by React Native 2.2.
peerDependencyRules:
  allowAny:
    - "@powersync/common"

catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  "@types/node": ^22.20.1
  "@cloudflare/workers-types": ^5.20260728.1
  hono: ^4.12.32
  "@orpc/server": ^1.14.12
  "@orpc/openapi": ^1.14.12
  "@orpc/zod": ^1.14.12
  "@orpc/client": ^1.14.12
allowBuilds:
  workerd: true
  sharp: true
  "@fails-components/webtransport-transport-http3-quiche": true
  "@shopify/react-native-skia": true
  esbuild: true
  msgpackr-extract: true
  node-pty: true
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true
  unrs-resolver: true
  better-sqlite3: true

nodeLinker: hoisted

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.16"
  - "@expo/config@57.0.8"
  - "@expo/fingerprint@0.20.8"
  - "@expo/inline-modules@0.1.6"
  - "@expo/log-box@57.0.3"
  - expo-asset@57.0.12
  - expo-constants@57.0.12
  - expo@57.0.14
  - "@expo/metro-runtime@57.0.11"
  - expo-build-properties@57.0.12
  - expo-dev-client@57.0.13
  - expo-dev-launcher@57.0.13
  - expo-dev-menu@57.0.13
  - expo-router@57.0.14
  - expo-splash-screen@57.0.7
  - expo-updates@57.0.15
