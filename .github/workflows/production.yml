name: Production with EAS

concurrency:
  # Serialised rather than cancelled: an in-flight publish that gets killed
  # partway can leave a half-uploaded update as the newest one on the channel.
  # Queue pushes instead so they land in order.
  group: production-update
  cancel-in-progress: false

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  # Always runs. Gates every downstream job on ts:check + jest (jest.yml and
  # typescript.yml only run on pull_request, so a direct push to main would
  # otherwise reach users unchecked), then fingerprints the commit to decide
  # whether the change is native (needs a build) or JS-only (an OTA suffices).
  gate:
    name: Gate & fingerprint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      native-changed: ${{ steps.decide.outputs.native-changed }}
    steps:
      - name: 🔍 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: 🏗 Setup repo
        uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Λ Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run Typescript check
        run: pnpm run ts:check

      - name: 🎭 Run Jest
        run: pnpm test:ci

      # Fingerprint the current commit (EAS algorithm, production profile) and
      # check whether any finished production iOS build already carries that
      # exact fingerprint. A match means an installable binary can run this
      # commit — including after reverting to an earlier native state — so an
      # OTA suffices; no match means native code changed and we must build.
      #
      # NB: this is deliberately a plain script rather than Expo's
      # continuous-deploy-fingerprint-info action: that action runs its own
      # pnpm/setup, which errors against our pinned `packageManager` field
      # (ERR_PNPM_BAD_PM_VERSION). We gate on iOS since that's the platform we ship.
      - name: 🫆 Decide release type
        id: decide
        run: |
          set -euo pipefail
          CURRENT="$(eas fingerprint:generate --platform ios --build-profile production --json --non-interactive | jq -r '.hash')"
          echo "Current fingerprint: $CURRENT"
          MATCH="$(eas build:list --platform ios --profile production --status finished --limit 50 --json --non-interactive \
            | jq -r --arg h "$CURRENT" '[.[] | select(.fingerprint.hash == $h)] | length')"
          if [ "$MATCH" -gt 0 ]; then
            echo "native-changed=false" >> "$GITHUB_OUTPUT"
            echo "→ Matching iOS build exists: publishing an OTA update."
          else
            echo "native-changed=true" >> "$GITHUB_OUTPUT"
            echo "→ No matching iOS build: build + TestFlight."
          fi

  # JS-only change: deliver over-the-air. Only reaches native builds with a
  # matching fingerprint runtime version (see runtimeVersion.policy in app.config.ts).
  ota-update:
    name: Publish production update (OTA)
    needs: gate
    if: needs.gate.outputs.native-changed == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🌿 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Λ Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Publish production update
        env:
          # Passed through the environment, not interpolated into the run block —
          # a commit message is attacker-controllable text and would otherwise be
          # a script-injection vector.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # First line only: update messages are single-line. workflow_dispatch
          # has no head_commit, so fall back to the short SHA.
          MESSAGE="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"
          eas update \
            --branch production \
            --environment production \
            --message "${MESSAGE:-Manual update from ${GITHUB_SHA::7}}" \
            --non-interactive

  # Native change: OTA can't carry it, so build iOS and ship it to TestFlight.
  # --auto-submit requires an App Store Connect API Key registered with EAS
  # (one-time `eas credentials` / dashboard setup); no extra GitHub secret needed.
  native-release:
    name: Build & submit iOS to TestFlight
    needs: gate
    if: needs.gate.outputs.native-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🌿 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Λ Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🍏 Build & submit iOS to TestFlight
        run: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --auto-submit
