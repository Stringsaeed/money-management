name: Supabase pgTAP

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"

jobs:
  pgtap:
    name: RLS negative tests
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v7

      - name: 🧰 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned for reproducibility: -x exclusions and config parsing have
          # shifted between CLI releases. Bump deliberately alongside local dev.
          version: 2.109.1

      - name: 🚀 Start local stack (DB + auth only)
        # Only Postgres is needed for migrations + pgTAP; skip the heavier services.
        # kong must stay: `supabase start` health-checks through the API gateway.
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,storage-api,realtime,analytics,mailpit,inbucket

      - name: 🧪 Run pgTAP suite
        run: supabase test db
