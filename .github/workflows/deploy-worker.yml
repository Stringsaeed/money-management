name: Deploy Worker

concurrency:
  group: deploy-worker
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "packages/api/**"
      - "packages/auth/**"
      - "packages/db/**"
      - "packages/domain/**"
      - "packages/env/**"
      - "packages/infra/**"
      - "packages/protocol/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    name: Alchemy deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v7

      - name: 🔍 Check deployment secrets + cutover approval
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          PLANETSCALE_HOST: ${{ secrets.PLANETSCALE_HOST }}
          PLANETSCALE_DATABASE: ${{ secrets.PLANETSCALE_DATABASE }}
          PLANETSCALE_USER: ${{ secrets.PLANETSCALE_USER }}
          PLANETSCALE_PASSWORD: ${{ secrets.PLANETSCALE_PASSWORD }}
          POWERSYNC_URL: ${{ secrets.POWERSYNC_URL }}
          POWERSYNC_JWT_PRIVATE_KEY: ${{ secrets.POWERSYNC_JWT_PRIVATE_KEY }}
          POWERSYNC_JWT_KID: ${{ secrets.POWERSYNC_JWT_KID }}
          PLANETSCALE_CUTOVER_APPROVED: ${{ vars.PLANETSCALE_CUTOVER_APPROVED }}
          ALCHEMY_STAGE: ${{ vars.ALCHEMY_STAGE }}
        run: bash packages/infra/scripts/check-production-cutover.sh

      # GitHub UI pastes often include a trailing newline. Cloudflare then
      # returns code 10000 Authentication error while the same token works
      # in a local curl. Trim before any CF / Alchemy call.
      - name: 🔐 Prove Actions token authenticates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')
          echo "token_len=${#TOKEN} account_len=${#ACCOUNT}"
          if [ "${#ACCOUNT}" -ne 32 ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be 32 hex chars (got ${#ACCOUNT}). Use Workers & Pages → Account details."
            exit 1
          fi
          auth=(-H "Authorization: Bearer ${TOKEN}")
          # 1) Same check as a local curl — user-scoped; can pass with zero account access.
          verify=$(curl -sS "${auth[@]}" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "tokens/verify: $(echo "$verify" | jq -c '{success,status:.result.status,errors}')"
          echo "$verify" | jq -e '.success == true and .result.status == "active"' >/dev/null
          # 2) Alchemy's first CF call (errors are swallowed inside Alchemy).
          sub=$(curl -sS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/workers/subdomain")
          echo "workers/subdomain: $(echo "$sub" | jq -c '{success,errors}')"
          echo "$sub" | jq -e '.success == true' >/dev/null
          # 3) Cloudflare.state() needs Secrets Store on this account.
          stores=$(curl -sS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/secrets_store/stores")
          echo "secrets_store/stores: $(echo "$stores" | jq -c '{success,errors,count:(.result|length)}')"
          if ! echo "$stores" | jq -e '.success == true' >/dev/null; then
            echo "::error::CLOUDFLARE_API_TOKEN cannot use Secrets Store on this account. Alchemy Cloudflare.state() requires Account permission 'Secrets Store — Edit' (secrets_store:write). Edit the token at https://dash.cloudflare.com/profile/api-tokens or create a new one with that permission, then update the repository secret."
            exit 1
          fi

      - name: 🧰 Setup project
        uses: ./.github/actions/setup

      - name: 🚀 Deploy Worker
        working-directory: packages/infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          PLANETSCALE_HOST: ${{ secrets.PLANETSCALE_HOST }}
          PLANETSCALE_DATABASE: ${{ secrets.PLANETSCALE_DATABASE }}
          PLANETSCALE_USER: ${{ secrets.PLANETSCALE_USER }}
          PLANETSCALE_PASSWORD: ${{ secrets.PLANETSCALE_PASSWORD }}
          POWERSYNC_URL: ${{ secrets.POWERSYNC_URL }}
          POWERSYNC_JWT_PRIVATE_KEY: ${{ secrets.POWERSYNC_JWT_PRIVATE_KEY }}
          POWERSYNC_JWT_KID: ${{ secrets.POWERSYNC_JWT_KID }}
          PLANETSCALE_CUTOVER_APPROVED: ${{ vars.PLANETSCALE_CUTOVER_APPROVED }}
          # Optional. Empty uses Alchemy Config defaults (kill switch off).
          KILL_SWITCH_LOCAL_ONLY: ${{ secrets.KILL_SWITCH_LOCAL_ONLY }}
          ANDROID_CERT_FINGERPRINTS: ${{ secrets.ANDROID_CERT_FINGERPRINTS }}
          # Must match the stage used for prior Alchemy deploys. Override with
          # repo variable ALCHEMY_STAGE if your cloud state is not "prod".
          ALCHEMY_STAGE: ${{ vars.ALCHEMY_STAGE }}
          CI: true
        run: |
          STAGE="${ALCHEMY_STAGE:-prod}"
          echo "Deploying Alchemy stage: $STAGE"
          if [ -z "$KILL_SWITCH_LOCAL_ONLY" ]; then
            export KILL_SWITCH_LOCAL_ONLY=off
          fi
          # Strip UI paste newlines so Alchemy sees the same bytes as curl.
          export CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')
          export CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n' | tr '[:upper:]' '[:lower:]')
          pnpm exec alchemy deploy --stage "$STAGE" --yes
