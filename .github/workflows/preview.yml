name: Preview with EAS

concurrency:
  # Make sure every job on main has unique group id (run_id), so cancel-in-progress only affects PR's
  # https://stackoverflow.com/questions/74117321/if-condition-in-concurrency-in-gha
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch to create the preview on. Only required for non-`pull_request` triggers."
        required: false
        default: ""

  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview-with-eas:
    name: Preview with EAS
    runs-on: ubuntu-latest
    concurrency: fingerprint-${{ github.run_id }}
    permissions:
      contents: read
      pull-requests: write
      actions: write
      packages: write
    steps:
      - name: 🔍 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: 🏗 Setup repo
        uses: actions/checkout@v7

      - name: 🧰 Setup project
        uses: ./.github/actions/setup
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 Create preview
        # Non-blocking: the EAS project is mid-rebrand (app slug "trove" vs the
        # project the configured projectId resolves to), so `eas update` can fail
        # on a slug mismatch. That is an Expo-side config issue, not a PR defect,
        # so a failed preview should not block merges. Remove once EAS is realigned.
        continue-on-error: true
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --channel preview --environment preview --message "Preview from ${{ github.actor }} for ${{ github.event.pull_request.title || github.ref_name }}"
          working-directory: apps/mobile
