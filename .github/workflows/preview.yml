name: Preview with EAS

concurrency:
  # Make sure every job on main has unique group id (run_id), so cancel-in-progress only affects PR's
  # https://stackoverflow.com/questions/74117321/if-condition-in-concurrency-in-gha
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch to create the preview on. Only required for non-`pull_request` triggers."
        required: false
        default: ""

  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview-with-eas:
    name: Preview with EAS
    runs-on: ubuntu-latest
    concurrency: fingerprint-${{ github.run_id }}
    permissions:
      contents: read
      pull-requests: write
      actions: write
      packages: write
    steps:
      - name: 🔍 Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: 🏗 Setup repo
        uses: actions/checkout@v7

      - name: 🧰 Setup project
        uses: ./.github/actions/setup
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 Create preview
        # Non-blocking until apps/mobile-next is linked to EAS (projectId, preview
        # channel, preview environment). Those live in the store-listing config
        # PR, so `eas update` cannot publish yet. A failed preview should not
        # block merges. Remove continue-on-error once that config is on main.
        continue-on-error: true
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --channel preview --environment preview --message "Preview from ${{ github.actor }} for ${{ github.event.pull_request.title || github.ref_name }}"
          working-directory: apps/mobile-next
