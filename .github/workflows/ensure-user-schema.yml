name: Ensure user schema

concurrency:
  group: ensure-user-schema
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  ensure:
    name: Ensure memberships_reconciled_at
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup repo
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Ensure user.memberships_reconciled_at
        working-directory: packages/db
        env:
          APPROVE_USER_SCHEMA_ENSURE: listmine-500
          PLANETSCALE_HOST: ${{ secrets.PLANETSCALE_HOST }}
          PLANETSCALE_DATABASE: ${{ secrets.PLANETSCALE_DATABASE }}
          PLANETSCALE_USER: ${{ secrets.PLANETSCALE_USER }}
          PLANETSCALE_PASSWORD: ${{ secrets.PLANETSCALE_PASSWORD }}
        run: node scripts/ensure-user-memberships-reconciled-at.mjs
