appId: com.stringsaeed.moneymanagement
name: Anonymous local Category creation
tags:
  - anonymous
  - local
  - smoke
---
# Precondition: launch the Expo dev client through `stim ios` before this flow.
# `clearState` would reset the dev-client shell rather than only Trove's ledger.
- launchApp
- openLink: trove:///
- evalScript: ${output.categoryName = 'Maestro Groceries ' + new Date().getTime()}
- openLink: trove://settings/household
- extendedWaitUntil:
    timeout: 15000
    visible:
      id: "profile-sign-in"
- openLink: trove:///
- extendedWaitUntil:
    timeout: 45000
    visible: "Upcoming payments"
- openLink: trove://categories
- extendedWaitUntil:
    timeout: 15000
    visible: "Categories"
# The Categories FAB currently has no accessibility identifier or testID.
- tapOn:
    point: "84%, 92%"
- extendedWaitUntil:
    timeout: 15000
    visible: "Add Category"
- tapOn: "e.g. Groceries"
- inputText: ${output.categoryName}
- hideKeyboard
- tapOn:
    id: "create-resource-submit"
- extendedWaitUntil:
    timeout: 15000
    notVisible: "Add Category"
- scrollUntilVisible:
    element: ${output.categoryName}
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- assertVisible: ".*${output.categoryName}.*"
