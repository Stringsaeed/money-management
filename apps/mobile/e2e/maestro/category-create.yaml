appId: com.stringsaeed.moneymanagement
name: Resource Category creation
tags:
  - resource
  - category
  - smoke
---
# Reusable in either ledger mode. Pass EXPECTED_PROFILE_ID as
# `profile-sign-in` before auth or `profile-sign-out` after personal sync.
# Pass RUN_LABEL to keep the generated record easy to identify.
# Preconditions: launch the Expo dev client through `stim ios`; do not use
# `clearState`, which resets the dev-client shell rather than Trove's ledger.
- launchApp
- openLink: trove:///
- evalScript: ${output.categoryName = RUN_LABEL + ' Groceries ' + new Date().getTime()}
- openLink: trove://settings/household
- extendedWaitUntil:
    timeout: 15000
    visible:
      id: ${EXPECTED_PROFILE_ID}
- openLink: trove:///
- extendedWaitUntil:
    timeout: 45000
    visible: "Upcoming payments"
- openLink: trove://categories
- extendedWaitUntil:
    timeout: 15000
    visible: "Categories"
# The Categories FAB currently has no accessibility identifier or testID.
- tapOn:
    point: "84%, 92%"
- extendedWaitUntil:
    timeout: 15000
    visible: "Add Category"
- tapOn: "e.g. Groceries"
- inputText: ${output.categoryName}
- hideKeyboard
- tapOn:
    id: "create-resource-submit"
- extendedWaitUntil:
    timeout: 15000
    notVisible: "Add Category"
- scrollUntilVisible:
    element: ${output.categoryName}
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- assertVisible: ".*${output.categoryName}.*"
