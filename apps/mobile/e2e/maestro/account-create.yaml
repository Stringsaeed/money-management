appId: com.stringsaeed.moneymanagement
name: Resource Account creation
tags:
  - resource
  - account
  - smoke
---
# Reusable in either ledger mode. Pass EXPECTED_PROFILE_ID as
# `profile-sign-in` before auth or `profile-sign-out` after personal sync.
# Pass RUN_LABEL to keep the generated record easy to identify.
# Preconditions: launch the Expo dev client through `stim ios`; do not use
# `clearState`, which resets the dev-client shell rather than Trove's ledger.
- launchApp
- openLink: trove:///
- evalScript: ${output.accountName = RUN_LABEL + ' Checking ' + new Date().getTime()}
- openLink: trove://settings/household
- extendedWaitUntil:
    timeout: 15000
    visible:
      id: ${EXPECTED_PROFILE_ID}
- openLink: trove:///
- extendedWaitUntil:
    timeout: 45000
    visible: "Upcoming payments"
- openLink: trove://accounts
- extendedWaitUntil:
    timeout: 15000
    visible: "Accounts"
- tapOn:
    point: "84%, 92%"
- extendedWaitUntil:
    timeout: 15000
    visible: "Add Account"
- tapOn: "e.g. Main Checking"
- inputText: ${output.accountName}
- hideKeyboard
- tapOn:
    id: "create-resource-submit"
- extendedWaitUntil:
    timeout: 15000
    notVisible: "Add Account"
- scrollUntilVisible:
    element: ${output.accountName}
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- assertVisible: ".*${output.accountName}.*"
