appId: com.stringsaeed.moneymanagement.next
---
# Home is showing the empty-account prompt. Leaves the app on Home.
- tapOn: "Add account"
- extendedWaitUntil:
    timeout: 20000
    visible: "New account"
- tapOn:
    id: "account-name-field"
- eraseText
- inputText: "Maestro Checking"
- hideKeyboard
- tapOn:
    text: "1"
    below:
      id: "account-name-field"
- tapOn:
    text: "2"
    below:
      id: "account-name-field"
- tapOn: "Decimal point"
- tapOn:
    text: "5"
    below:
      id: "account-name-field"
- tapOn: "Save"
- extendedWaitUntil:
    timeout: 30000
    notVisible: "New account"
- tapOn: "Ledger"
- extendedWaitUntil:
    timeout: 20000
    visible: "Open Accounts"
- tapOn: "Open Accounts"
- extendedWaitUntil:
    timeout: 30000
    visible: "Maestro Checking"
- back
- tapOn: "Home"
- extendedWaitUntil:
    timeout: 20000
    visible: "Latest activity"
- extendedWaitUntil:
    timeout: 20000
    notVisible: "Add an account to start your overview."
