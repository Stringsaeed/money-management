appId: com.stringsaeed.moneymanagement.next
---
# Fresh install state, then a guest session on Home.
- launchApp:
    clearState: true
- extendedWaitUntil:
    timeout: 45000
    visible: "Continue as guest"
- tapOn: "Continue as guest"
- scrollUntilVisible:
    element:
      text: "Add an account to start your overview."
    direction: DOWN
    timeout: 45000
    centerElement: true
- assertVisible: "Ledger scope: Personal"
