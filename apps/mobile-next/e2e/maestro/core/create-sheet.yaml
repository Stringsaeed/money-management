appId: com.stringsaeed.moneymanagement.next
name: Create sheet opens each editor
tags:
  - core
---
- runFlow: ../subflows/launch-guest.yaml
- longPressOn: "Create"
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "create-action-sheet"
- assertVisible: "Transaction"
- assertVisible: "Account"
- assertVisible: "Category"
- tapOn: "Account"
- extendedWaitUntil:
    timeout: 20000
    visible: "New account"
- tapOn: "Close"
- assertNotVisible: "New account"
- longPressOn: "Create"
- extendedWaitUntil:
    timeout: 10000
    visible:
      id: "create-action-sheet"
- tapOn: "Category"
- extendedWaitUntil:
    timeout: 20000
    visible: "New category"
- tapOn: "Close"
- assertNotVisible: "New category"
- tapOn: "Create"
- extendedWaitUntil:
    timeout: 20000
    visible: "New transaction"
- tapOn: "Close"
- assertNotVisible: "New transaction"
