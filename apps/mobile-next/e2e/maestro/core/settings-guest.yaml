appId: com.stringsaeed.moneymanagement.next
name: Profile ends the guest session
tags:
  - core
---
- runFlow: ../subflows/launch-guest.yaml
- tapOn: "Settings"
- assertVisible: "Profile"
- assertVisible: "Sounds"
- assertVisible: "Smart categories"
- scrollUntilVisible:
    element:
      text: "End guest session"
    direction: DOWN
    timeout: 20000
    centerElement: true
- tapOn: "End guest session"
- tapOn: "End session"
- extendedWaitUntil:
    timeout: 20000
    visible: "Continue as guest"
- assertVisible: "Sign in with WorkOS"
