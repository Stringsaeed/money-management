appId: com.stringsaeed.moneymanagement.next
name: Guest reaches Home
tags:
  - main
---
- runFlow: ../subflows/launch-guest.yaml
- assertVisible: "Latest activity"
- scrollUntilVisible:
    element:
      text: "Budgets"
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible: "COMING SOON"
- scrollUntilVisible:
    element:
      text: "Nothing scheduled"
    direction: DOWN
    timeout: 30000
    centerElement: true
- assertVisible: "Upcoming transactions"
